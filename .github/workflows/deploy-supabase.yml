name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.1.0

      - name: Deploy AI tutor
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy ai-tutor --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" --yes

      - name: Deploy live video teacher\n        env:\n          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}\n        run: supabase functions deploy live-video-teacher --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" --yes\n\n      - name: Deploy submission reviewer
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy review-submission --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" --yes
